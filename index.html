
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Smart Order Management</title>
    <meta name="description" content="A modern app for managing restaurant orders with dynamic menus and role-based dashboards, using WebSocket and Postgres." />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/Garsone_Favicon.svg?v=light" />

    <script>
      (function () {
        const lightHref = '/Garsone_Favicon.svg?v=light';
        const darkHref = '/Garsone_Favicon.dark.svg?v=dark';
        const root = document.documentElement;

        function readPreference(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        function ensureLink() {
          let link = document.getElementById('app-favicon');
          if (!link) {
            link = document.createElement('link');
            link.id = 'app-favicon';
            link.rel = 'icon';
            link.type = 'image/svg+xml';
            document.head.appendChild(link);
          }
          return link;
        }

        function setFavicon(isDark) {
          const link = ensureLink();
          const href = isDark ? darkHref : lightHref;
          if (link.getAttribute('href') !== href) link.setAttribute('href', href);
        }

        function computeIsDark() {
          const saved = readPreference('theme');
          if (saved === 'light') return false;
          if (saved === 'system') {
            return Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          return true;
        }

        function applyAppearance(isDark) {
          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          setFavicon(isDark);
        }

        // Apply the same dark/Modern Mist defaults as React before the first paint.
        const palettes = {
          classic: '',
          'luxe-ember': 'theme-luxe-ember',
          'nocturne-marina': 'theme-nocturne-marina',
          'modern-mist': 'theme-modern-mist',
          'velvet-dusk': 'theme-velvet-dusk',
        };
        const savedPalette = readPreference('dashboardTheme');
        const palette = Object.prototype.hasOwnProperty.call(palettes, savedPalette)
          ? palettes[savedPalette]
          : palettes['modern-mist'];
        if (palette) root.classList.add(palette);
        applyAppearance(computeIsDark());

        // Watch <html> class changes from the ThemeProvider
        const obs = new MutationObserver(() => {
          const isDark = root.classList.contains('dark');
          const isLight = root.classList.contains('light');
          if (isDark || isLight) setFavicon(isDark);
        });
        obs.observe(root, { attributes: true, attributeFilter: ['class'] });

        // If user uses system theme, reflect OS changes too
        const mql =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mql && mql.addEventListener) {
          mql.addEventListener('change', () => {
            if (readPreference('theme') === 'system') applyAppearance(mql.matches);
          });
        }
      })();
    </script>

    <meta property="og:title" content="Smart Order Management" />
    <meta property="og:description" content="A modern app for managing restaurant orders with dynamic menus and role-based dashboards, using WebSocket and Postgres." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
