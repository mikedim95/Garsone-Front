log_format garsone_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  # Query strings can carry legacy WebSocket tokens; omit them from access logs.
  access_log /var/log/nginx/access.log garsone_safe;

  location /api/ {
    proxy_pass http://${CORE_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
  location /uploads/ {
    proxy_pass http://${CORE_UPSTREAM};
    proxy_set_header Host $http_host;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location = /sw.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /customer-push-sw.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
